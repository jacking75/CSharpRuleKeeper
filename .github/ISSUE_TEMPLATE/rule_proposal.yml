name: Rule proposal
description: Propose a semantic or style rule with test cases
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and difference from existing rules
    validations:
      required: true
  - type: textarea
    id: cases
    attributes:
      label: Pass, violation, exception and boundary cases
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Semantic defect prevention
        - Team style preference
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Code Fix safety
      description: Explain contract preservation or state that no fix should exist
    validations:
      required: true
